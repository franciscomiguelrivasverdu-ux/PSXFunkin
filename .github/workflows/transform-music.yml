name: Transform Audio to XA Format

on:
  push:
    paths:
      - 'audio/**'  # Solo se activa cuando cambian archivos en 'audio/'
    branches: [ main, master ]
  workflow_dispatch:  # Permite ejecución manual desde GitHub

jobs:
  transform-audio:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup FFmpeg
      run: sudo apt-get update && sudo apt-get install -y ffmpeg

    - name: Transform MP3 to XA
      run: |
        mkdir -p xa_output
        # Convertir todos los archivos de audio
        for file in audio/*.mp3 audio/*.wav audio/*.flac 2>/dev/null; do
          if [ -f "$file" ]; then
            filename=$(basename "$file" .${file##*.})
            echo "Converting: $file -> xa_output/${filename}.xa"
            ffmpeg -i "$file" -acodec adpcm_ima_ea_xas "xa_output/${filename}.xa"
          fi
        done

    - name: Commit and push XA files
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"
        git add xa_output/
        git diff --cached --quiet || (git commit -m "Auto-generated XA audio files" && git push)
