name: Transform Audio to XA Format

on:
  push:
    paths:
      - 'audio/**'
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  transform-audio:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup FFmpeg
      run: sudo apt-get update && sudo apt-get install -y ffmpeg

    - name: Create output directory
      run: mkdir -p xa_output

    - name: Transform audio files
      run: |
        echo "Buscando archivos de audio en 'audio/'..."
        
        # Convertir archivos MP3
        for file in audio/*.mp3; do
          if [ -f "$file" ]; then
            filename=$(basename "$file" .mp3)
            echo "Convirtiendo MP3: $file -> xa_output/${filename}.xa"
            ffmpeg -i "$file" -acodec adpcm_ima_ea_xas "xa_output/${filename}.xa"
          fi
        done
        
        # Convertir archivos WAV
        for file in audio/*.wav; do
          if [ -f "$file" ]; then
            filename=$(basename "$file" .wav)
            echo "Convirtiendo WAV: $file -> xa_output/${filename}.xa"
            ffmpeg -i "$file" -acodec adpcm_ima_ea_xas "xa_output/${filename}.xa"
          fi
        done
        
        # Convertir archivos FLAC
        for file in audio/*.flac; do
          if [ -f "$file" ]; then
            filename=$(basename "$file" .flac)
            echo "Convirtiendo FLAC: $file -> xa_output/${filename}.xa"
            ffmpeg -i "$file" -acodec adpcm_ima_ea_xas "xa_output/${filename}.xa"
          fi
        done

    - name: List generated files
      run: ls -la xa_output/

    - name: Commit and push XA files
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"
        git add xa_output/
        
        # Verificar si hay cambios para commit
        if git diff --cached --quiet; then
          echo "No hay cambios para commit"
        else
          git commit -m "Auto-generated XA audio files"
          git push
        fi
