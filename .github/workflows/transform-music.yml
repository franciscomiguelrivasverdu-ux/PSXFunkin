name: Transform Audio to XA Format

on:
  push:
    paths:
      - 'audio/**'  # Ruta donde subes tu música
    branches: [ main, master ]
  workflow_dispatch:  # Permite ejecución manual

jobs:
  transform-audio:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup FFmpeg (para conversión de audio)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Transform audio files
      run: |
        mkdir -p xa_output
        # Buscar archivos de audio y convertir a XA
        find audio -type f \( -name "*.mp3" -o -name "*.wav" -o -name "*.flac" \) | while read file; do
          filename=$(basename "$file" | cut -d. -f1)
          ffmpeg -i "$file" -acodec adpcm_ima_ea_xas "xa_output/${filename}.xa"
        done

    - name: Commit and push XA files
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add xa_output/
        git commit -m "Auto-generated XA audio files" || echo "No changes to commit"
        git push origin HEAD:${{ github.ref_name }}
