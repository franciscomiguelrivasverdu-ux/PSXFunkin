name: Build PSXFunkin

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:  # Permite ejecución manual

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout PSXFunkin
      uses: actions/checkout@v4
      
    - name: Checkout PsyQ SDK
      uses: actions/checkout@v4
      with:
        repository: franciscomiguelrivasverdu-ux/PSYQ
        path: psyq-sdk
        
    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y make dos2unix ffmpeg sox
        git clone https://github.com/Lameguy64/psx-tools.git
        cd psx-tools
        make
        sudo cp wav2xa /usr/local/bin/
        
    - name: Setup PsyQ
      run: |
        mkdir -p mips/psyq
        cp -r psyq-sdk/* mips/psyq/
        chmod +x mips/psyq/BIN/*
        dos2unix mips/psyq/BIN/* 2>/dev/null || true
        
    - name: Convert assets if needed
      run: |
        # Verificar si ya hay assets convertidos
        if [ ! -f "ASSETS/music.xa" ]; then
          echo "Converting assets..."
          # Aquí irían los comandos de conversión
          # wav2xa ASSETS/music.wav ASSETS/music.xa
        else
          echo "Assets already converted"
        fi
        
    - name: Compile
      run: |
        export PSYQ_PATH=$(pwd)/mips/psyq
        export PATH=$PATH:$PSYQ_PATH/BIN
        make
        
    - name: Upload build
      uses: actions/upload-artifact@v4
      with:
        name: psxfunkin-ps1
        path: |
          PSXFUNKIN.BIN
          PSXFUNKIN.CUE
          PSXFUNKIN.EXE
